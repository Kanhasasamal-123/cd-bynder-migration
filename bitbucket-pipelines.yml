image: node:22

definitions:
  steps:
    - step: &lint-build-test
        name: Lint, Build, and Test
        caches:
          - node
        script:
          - npm ci
          # - npm run lint
          - npm run build
          - export CD_DIVISION_ID=${CD_DIVISION_ID:-76}
          - npm test

    - step: &package-lambda
        name: Package Lambda Functions
        caches:
          - node
        script:
          - apt-get update && apt-get install -y zip
          - npm ci
          - npm run build
          - cd dist
          - zip -r ../lambda-deployment.zip .
          - cd ..
          - zip -r lambda-deployment.zip node_modules
        artifacts:
          - lambda-deployment.zip

    - step: &deploy-cloudformation
        name: Deploy CloudFormation Stack
        deployment: Production
        script:
          # Install AWS CLI
          - apt-get update && apt-get install -y awscli

          # Configure AWS credentials
          - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          - export AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}

          # Set environment variables
          - export LAMBDA_BUCKET=${LAMBDA_BUCKET:-dam-migration-lambda-packages}
          - export STACK_NAME=${STACK_NAME:-dam-migration}

          # Create Lambda package bucket if it doesn't exist
          - |
            if ! aws s3 ls "s3://$LAMBDA_BUCKET" 2>/dev/null; then
              echo "Creating Lambda package bucket..."
              aws s3 mb "s3://$LAMBDA_BUCKET" --region $AWS_DEFAULT_REGION
              aws s3api put-bucket-versioning \
                --bucket $LAMBDA_BUCKET \
                --versioning-configuration Status=Enabled
              aws s3api put-public-access-block \
                --bucket $LAMBDA_BUCKET \
                --public-access-block-configuration \
                  BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
              echo "✓ Lambda package bucket created"
            else
              echo "✓ Lambda package bucket already exists"
            fi

          # Upload Lambda package to S3
          - export TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          - export S3_KEY="lambda-deployment-${TIMESTAMP}.zip"
          - aws s3 cp lambda-deployment.zip "s3://$LAMBDA_BUCKET/$S3_KEY"
          - echo "✓ Lambda package uploaded as $S3_KEY"

          # Validate CloudFormation template
          - |
            aws cloudformation validate-template \
              --template-body file://cloudformation/infrastructure.yml \
              --region $AWS_DEFAULT_REGION

          # Deploy CloudFormation stack
          - |
            aws cloudformation deploy \
              --template-file cloudformation/infrastructure.yml \
              --stack-name "$STACK_NAME" \
              --parameter-overrides \
                "Environment=prod" \
                "ProjectName=dam-migration" \
                "CreativeDriveApiKey=$CREATIVEDRIVE_API_KEY" \
                "BynderClientId=$BYNDER_CLIENT_ID" \
                "BynderClientSecret=$BYNDER_CLIENT_SECRET" \
                "BynderAccessTokenUrl=$BYNDER_ACCESS_TOKEN_URL" \
                "BynderApiBaseUrl=$BYNDER_API_BASE_URL" \
                "LambdaZipBucket=$LAMBDA_BUCKET" \
                "LambdaZipKey=$S3_KEY" \
              --capabilities CAPABILITY_NAMED_IAM \
              --region "$AWS_DEFAULT_REGION" \
              --no-fail-on-empty-changeset

          # Get stack outputs
          - echo "=========================================="
          - echo "CloudFormation Stack Outputs"
          - echo "=========================================="
          - |
            aws cloudformation describe-stacks \
              --stack-name $STACK_NAME \
              --region $AWS_DEFAULT_REGION \
              --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
              --output table
          - echo ""
          - echo "Deployment completed successfully!"
          - echo ""

pipelines:
  pull-requests:
    '**':
      - step: *lint-build-test

  branches:
    main:
      - step: *lint-build-test
      - step: *package-lambda
      - step: *deploy-cloudformation

  custom:
    run-migration:
      - variables:
          - name: MODE
            default: delta
            allowed-values:
              - delta
              - full
          - name: MAX_ASSETS
            default: "10"
          - name: FETCH_OFFSET
            default: ""
          - name: DIVISION_ID
            default: ""
          - name: FOLDER_ID
            default: ""
          - name: ASSET_ID
            default: ""
          - name: SYNC_LAST_DAYS
            default: ""
          - name: DATE_FROM
            default: ""
          - name: DATE_TO
            default: ""
          - name: DRY_RUN
            default: "false"
            allowed-values:
              - "true"
              - "false"
          - name: FETCH_SORT
            default: "desc"
      - step:
          name: Run DAM Migration
          deployment: Production
          script:
            # Install AWS CLI and jq
            - apt-get update && apt-get install -y awscli jq

            # Configure AWS credentials
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
            - export INGEST_LAMBDA=${INGEST_LAMBDA:-dam-migration-ingest-prod}

            # Display configuration
            - echo "=========================================="
            - echo "Invoking Ingest Lambda"
            - echo "=========================================="
            - echo "Function:$INGEST_LAMBDA"
            - echo "Mode:$MODE"
            - echo "Max Assets:$MAX_ASSETS"
            - echo "Fetch Sort:${FETCH_SORT:-desc}"
            - |
              if [ -n "$FETCH_OFFSET" ]; then
                echo "Fetch Offset:$FETCH_OFFSET"
              fi

            # Build payload with optional filters
            - export PAYLOAD="{\"maxAssets\":$MAX_ASSETS,\"mode\":\"$MODE\""

            # Require division ID
            - |
              if [ -z "$DIVISION_ID" ]; then
                echo "❌ DIVISION_ID is required (CreativeDrive division ID)"
                exit 1
              fi
              echo "Division ID: $DIVISION_ID"
              PAYLOAD="$PAYLOAD,\"divisionId\":\"$DIVISION_ID\""

            # Add folder ID filter if provided
            - |
              if [ -n "$FOLDER_ID" ]; then
                echo "Folder ID: $FOLDER_ID"
                PAYLOAD="$PAYLOAD,\"folderId\":\"$FOLDER_ID\""
              fi

            # Add asset ID(s) filter if provided
            - |
              if [ -n "$ASSET_ID" ]; then
                # Parse comma-separated asset IDs
                IFS=',' read -ra ASSET_IDS_ARRAY <<< "$ASSET_ID"
                ASSET_IDS_JSON="["
                for i in "${!ASSET_IDS_ARRAY[@]}"; do
                  if [ $i -gt 0 ]; then
                    ASSET_IDS_JSON="$ASSET_IDS_JSON,"
                  fi
                  # Trim whitespace and add quotes
                  ASSET_ID_TRIMMED=$(echo "${ASSET_IDS_ARRAY[$i]}" | xargs)
                  ASSET_IDS_JSON="$ASSET_IDS_JSON\"$ASSET_ID_TRIMMED\""
                done
                ASSET_IDS_JSON="$ASSET_IDS_JSON]"
                
                echo "Asset ID(s): $ASSET_ID"
                echo "Parsed as array: $ASSET_IDS_JSON"
                PAYLOAD="$PAYLOAD,\"assetIds\":$ASSET_IDS_JSON"
              fi

            # Add syncLastDays if provided
            - |
              if [ -n "$SYNC_LAST_DAYS" ]; then
                echo "Syncing last $SYNC_LAST_DAYS day(s)"
                PAYLOAD="$PAYLOAD,\"syncLastDays\":$SYNC_LAST_DAYS"
              fi

            # Add dateFrom if provided
            - |
              if [ -n "$DATE_FROM" ]; then
                echo "Date From: $DATE_FROM"
                PAYLOAD="$PAYLOAD,\"dateFrom\":\"$DATE_FROM\""
              fi

            # Add dateTo if provided
            - |
              if [ -n "$DATE_TO" ]; then
                echo "Date To: $DATE_TO"
                PAYLOAD="$PAYLOAD,\"dateTo\":\"$DATE_TO\""
              fi

            # Add fetchOffset if provided
            - |
              if [ -n "$FETCH_OFFSET" ]; then
                echo "Fetch Offset: $FETCH_OFFSET"
                PAYLOAD="$PAYLOAD,\"fetchOffset\":$FETCH_OFFSET"
              fi

            # Add fetchSort (defaults to desc)
            - |
              export FETCH_SORT_VALUE=${FETCH_SORT:-desc}
              echo "Fetch Sort: $FETCH_SORT_VALUE"
              PAYLOAD="$PAYLOAD,\"fetchSort\":\"$FETCH_SORT_VALUE\""

            # Dry run flag
            - |
              if [ "$DRY_RUN" = "true" ]; then
                echo "Dry run enabled"
                PAYLOAD="$PAYLOAD,\"dryRun\":true"
              fi

            - PAYLOAD="$PAYLOAD}"
            - echo ""
            - echo "Payload:$PAYLOAD"
            - echo ""

            # Invoke Lambda (async Event invocation)
            - |
              STATUS_CODE=$(aws lambda invoke \
                --function-name $INGEST_LAMBDA \
                --invocation-type Event \
                --payload "$PAYLOAD" \
                --region $AWS_DEFAULT_REGION \
                --cli-binary-format raw-in-base64-out \
                --output text \
                --query 'StatusCode' \
                /dev/null)

              echo "Lambda Status Code: $STATUS_CODE"

              if [ "$STATUS_CODE" = "202" ]; then
                echo "✅ Migration started successfully"
              else
                echo "❌ Lambda invocation failed with status code: $STATUS_CODE"
                exit 1
              fi

    clear-bynder-id-state:
      - variables:
          - name: DIVISION_ID
            default: ""
          - name: FOLDER_ID
            default: ""
          - name: MAX_ASSETS
            default: "10000"
          - name: FETCH_OFFSET
            default: ""
          - name: SYNC_LAST_DAYS
            default: ""
          - name: DATE_FROM
            default: ""
          - name: DATE_TO
            default: ""
          - name: DRY_RUN
            default: "false"
            allowed-values:
              - "true"
              - "false"
          - name: FETCH_SORT
            default: "desc"
      - step:
          name: Clear Bynder ID State (Ingest Lambda)
          deployment: Production
          script:
            - apt-get update && apt-get install -y awscli jq
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
            - export INGEST_LAMBDA=${INGEST_LAMBDA:-dam-migration-ingest-prod}
            - echo "=========================================="
            - echo "Clear bynderId on DynamoDB tracker records"
            - echo "=========================================="
            - echo "Function:$INGEST_LAMBDA"
            - echo "Action:clear-bynderId-state"
            - |
              if [ -z "$DIVISION_ID" ]; then
                echo "❌ DIVISION_ID is required"
                exit 1
              fi
              if [ -z "$FOLDER_ID" ]; then
                echo "❌ FOLDER_ID is required"
                exit 1
              fi
              echo "Division ID:$DIVISION_ID"
              echo "Folder ID:$FOLDER_ID"
            - export PAYLOAD="{\"action\":\"clear-bynderId-state\",\"maxAssets\":$MAX_ASSETS,\"divisionId\":\"$DIVISION_ID\",\"folderId\":\"$FOLDER_ID\""
            - |
              if [ -n "$FETCH_OFFSET" ]; then
                echo "Fetch Offset:$FETCH_OFFSET"
                PAYLOAD="$PAYLOAD,\"fetchOffset\":$FETCH_OFFSET"
              fi
            - |
              if [ -n "$SYNC_LAST_DAYS" ]; then
                echo "Sync Last Days:$SYNC_LAST_DAYS"
                PAYLOAD="$PAYLOAD,\"syncLastDays\":$SYNC_LAST_DAYS"
              fi
            - |
              if [ -n "$DATE_FROM" ]; then
                PAYLOAD="$PAYLOAD,\"dateFrom\":\"$DATE_FROM\""
              fi
            - |
              if [ -n "$DATE_TO" ]; then
                PAYLOAD="$PAYLOAD,\"dateTo\":\"$DATE_TO\""
              fi
            - |
              export FETCH_SORT_VALUE=${FETCH_SORT:-desc}
              PAYLOAD="$PAYLOAD,\"fetchSort\":\"$FETCH_SORT_VALUE\""
            - |
              if [ "$DRY_RUN" = "true" ]; then
                echo "Dry run enabled — no DynamoDB writes"
                PAYLOAD="$PAYLOAD,\"dryRun\":true"
              fi
            - PAYLOAD="$PAYLOAD}"
            - echo "Payload:$PAYLOAD"
            - |
              STATUS_CODE=$(aws lambda invoke \
                --function-name $INGEST_LAMBDA \
                --invocation-type Event \
                --payload "$PAYLOAD" \
                --region $AWS_DEFAULT_REGION \
                --cli-binary-format raw-in-base64-out \
                --output text \
                --query 'StatusCode' \
                /dev/null)
              echo "Lambda Status Code: $STATUS_CODE"
              if [ "$STATUS_CODE" = "202" ]; then
                echo "✅ clear-bynderId-state started — check CloudWatch for dam-migration-ingest-prod"
              else
                echo "❌ Lambda invocation failed with status code: $STATUS_CODE"
                exit 1
              fi

    retry-failed-assets:
      - variables:
          - name: ASSET_ID
            default: ""
          - name: ASSET_IDS_FILE
            default: ""
          - name: DRY_RUN
            default: "true"
            allowed-values:
              - "true"
              - "false"
          - name: ONLY_FAILED
            default: "true"
            allowed-values:
              - "true"
              - "false"
          - name: SYNC_INVOKE
            default: "true"
            allowed-values:
              - "true"
              - "false"
      - step:
          name: Retry Failed Assets (Ingest Lambda)
          deployment: Production
          script:
            - apt-get update && apt-get install -y awscli jq
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
            - export INGEST_LAMBDA=${INGEST_LAMBDA:-dam-migration-ingest-prod}
            - |
              set -euo pipefail
              echo "=========================================="
              echo "Reset FAILED tracker records to PENDING"
              echo "=========================================="
              echo "Function: $INGEST_LAMBDA"
              echo "Region: $AWS_DEFAULT_REGION"
              echo "Action: retry-failed-assets"
              echo "Sync invoke: ${SYNC_INVOKE:-true}"

              echo "AWS caller:"
              aws sts get-caller-identity

              echo "Lambda check:"
              aws lambda get-function --function-name "$INGEST_LAMBDA" --query 'Configuration.[FunctionName,LastModified,Runtime,Timeout]' --output table

              if [ -n "${ASSET_IDS_FILE:-}" ]; then
                if [ ! -f "$ASSET_IDS_FILE" ]; then
                  echo "❌ ASSET_IDS_FILE not found: $ASSET_IDS_FILE"
                  exit 1
                fi
                ASSET_IDS_JSON=$(jq -R -s -c 'split("\n") | map(gsub("\r"; "")) | map(select(length > 0))' "$ASSET_IDS_FILE")
                echo "Asset IDs from file: $ASSET_IDS_FILE"
              elif [ -n "${ASSET_ID:-}" ]; then
                # Paste one per line, comma-separated, or space-separated on one line
                ASSET_IDS_JSON=$(printf '%s' "$ASSET_ID" | tr ',;' '\n' | tr -s ' \t' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | jq -R . | jq -s -c .)
                echo "Asset IDs from ASSET_ID variable"
              else
                echo "❌ Provide ASSET_ID (paste one ID per line) or ASSET_IDS_FILE"
                exit 1
              fi

              ASSET_COUNT=$(echo "$ASSET_IDS_JSON" | jq 'length')
              echo "Parsed asset count: $ASSET_COUNT"
              echo "First IDs: $(echo "$ASSET_IDS_JSON" | jq -c '.[0:3]')"

              if [ "$ASSET_COUNT" -eq 0 ]; then
                echo "❌ No asset IDs parsed — Bitbucket may have stripped newlines from ASSET_ID."
                echo "   Try comma-separated on one line, or fewer IDs per run."
                exit 1
              fi

              ONLY_FAILED_JSON=$([ "${ONLY_FAILED:-true}" = "false" ] && echo false || echo true)
              DRY_RUN_JSON=$([ "${DRY_RUN:-true}" = "true" ] && echo true || echo false)

              jq -n \
                --arg action "retry-failed-assets" \
                --argjson assetIds "$ASSET_IDS_JSON" \
                --argjson dryRun "$DRY_RUN_JSON" \
                --argjson onlyFailed "$ONLY_FAILED_JSON" \
                '{action: $action, assetIds: $assetIds, dryRun: $dryRun, onlyFailed: $onlyFailed}' \
                > /tmp/retry-failed-payload.json

              echo "Payload bytes: $(wc -c < /tmp/retry-failed-payload.json)"
              echo "Payload preview:"
              head -c 500 /tmp/retry-failed-payload.json
              echo ""

              INVOKE_TYPE=$([ "${SYNC_INVOKE:-true}" = "true" ] && echo RequestResponse || echo Event)
              echo "Invoking Lambda ($INVOKE_TYPE)..."

              aws lambda invoke \
                --function-name "$INGEST_LAMBDA" \
                --invocation-type "$INVOKE_TYPE" \
                --payload file:///tmp/retry-failed-payload.json \
                --cli-binary-format raw-in-base64-out \
                /tmp/retry-failed-response.json

              echo "Lambda response:"
              cat /tmp/retry-failed-response.json
              echo ""

              if [ "$INVOKE_TYPE" = "Event" ]; then
                echo "✅ Async invoke accepted — check CloudWatch log group: /aws/lambda/$INGEST_LAMBDA"
              else
                STATUS_CODE=$(jq -r '.statusCode // empty' /tmp/retry-failed-response.json)
                if [ "$STATUS_CODE" = "200" ]; then
                  echo "✅ retry-failed-assets completed"
                  jq -r '.body // empty' /tmp/retry-failed-response.json | jq . 2>/dev/null || jq -r '.body // empty' /tmp/retry-failed-response.json
                else
                  echo "❌ Lambda returned statusCode: ${STATUS_CODE:-unknown}"
                  exit 1
                fi
              fi

    nightly-migration-76:
      - step:
          name: Nightly Migration - Division 76
          deployment: Production
          script:
            - apt-get update && apt-get install -y awscli jq
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
            - export INGEST_LAMBDA=${INGEST_LAMBDA:-dam-migration-ingest-prod}
            - export DIVISION_ID=76
            - export SYNC_LAST_DAYS=1
            - export MAX_ASSETS=5000
            - export MODE=full
            - export FETCH_SORT=desc
            - echo "=========================================="
            - echo "Nightly Migration - Division 76"
            - echo "=========================================="
            - echo "Function - $INGEST_LAMBDA"
            - echo "Division ID - $DIVISION_ID"
            - echo "Sync Last Days - $SYNC_LAST_DAYS"
            - echo "Max Assets - $MAX_ASSETS"
            - echo "Mode - $MODE"
            - echo "Fetch Sort - $FETCH_SORT"
            - PAYLOAD="{\"maxAssets\":$MAX_ASSETS,\"mode\":\"$MODE\",\"divisionId\":\"$DIVISION_ID\",\"syncLastDays\":$SYNC_LAST_DAYS,\"fetchSort\":\"$FETCH_SORT\"}"
            - echo "Payload - $PAYLOAD"
            - |
              STATUS_CODE=$(aws lambda invoke \
                --function-name $INGEST_LAMBDA \
                --invocation-type Event \
                --payload "$PAYLOAD" \
                --region $AWS_DEFAULT_REGION \
                --cli-binary-format raw-in-base64-out \
                --output text \
                --query 'StatusCode' \
                /dev/null)
              echo "Lambda Status Code: $STATUS_CODE"
              if [ "$STATUS_CODE" = "202" ]; then
                echo "✅ Nightly migration for Division 76 started successfully"
              else
                echo "❌ Lambda invocation failed with status code: $STATUS_CODE"
                exit 1
              fi

    nightly-migration-white-bg-divisions:
      - step:
          name: Nightly Migration - White BG Divisions
          deployment: Production
          script:
            - apt-get update && apt-get install -y awscli jq
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
            - export INGEST_LAMBDA=${INGEST_LAMBDA:-dam-migration-ingest-prod}
            # 45 HBSLG, 46 Footwear, 65 RTW, 89 Licensed, 231 MKC ACC, 232 MKC Footwear, 233 MKC RTW
            - export WHITE_BG_DIVISION_IDS="45 46 65 89 231 232 233"
            - export SYNC_LAST_DAYS=1
            - export MAX_ASSETS=5000
            - export MODE=full
            - export FETCH_SORT=desc
            - echo "=========================================="
            - echo "Nightly Migration - White BG Divisions"
            - echo "=========================================="
            - echo "Function - $INGEST_LAMBDA"
            - echo "Divisions - $WHITE_BG_DIVISION_IDS"
            - echo "Sync Last Days - $SYNC_LAST_DAYS"
            - echo "Max Assets - $MAX_ASSETS"
            - echo "Mode - $MODE"
            - echo "Fetch Sort - $FETCH_SORT"
            - |
              FAILED=0
              for DIVISION_ID in $WHITE_BG_DIVISION_IDS; do
                echo ""
                echo "------------------------------------------"
                echo "Division ID - $DIVISION_ID"
                PAYLOAD="{\"maxAssets\":$MAX_ASSETS,\"mode\":\"$MODE\",\"divisionId\":\"$DIVISION_ID\",\"syncLastDays\":$SYNC_LAST_DAYS,\"fetchSort\":\"$FETCH_SORT\"}"
                echo "Payload - $PAYLOAD"
                STATUS_CODE=$(aws lambda invoke \
                  --function-name $INGEST_LAMBDA \
                  --invocation-type Event \
                  --payload "$PAYLOAD" \
                  --region $AWS_DEFAULT_REGION \
                  --cli-binary-format raw-in-base64-out \
                  --output text \
                  --query 'StatusCode' \
                  /dev/null)
                echo "Lambda Status Code: $STATUS_CODE"
                if [ "$STATUS_CODE" = "202" ]; then
                  echo "✅ Nightly migration for Division $DIVISION_ID started successfully"
                else
                  echo "❌ Lambda invocation failed for Division $DIVISION_ID with status code: $STATUS_CODE"
                  FAILED=1
                fi
              done
              echo ""
              if [ "$FAILED" -ne 0 ]; then
                echo "❌ One or more white BG division migrations failed to start"
                exit 1
              fi
              echo "✅ Nightly migration started for all white BG divisions"

