name: DAM Migration Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  STACK_NAME: dam-migration
  PROJECT_NAME: dam-migration
  LAMBDA_BUCKET: cd-bynder-migration-lambda-676480496045-us-east-1
  LAMBDA_ZIP_KEY: lambda-deployment.zip

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Package Lambda
        shell: bash
        run: |
          rm -f lambda-deployment.zip

          cd dist
          zip -r ../lambda-deployment.zip .
          cd ..

          zip -r lambda-deployment.zip node_modules

          ls -lh lambda-deployment.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS configuration
        run: |
          echo "AWS Region: $AWS_REGION"
          aws sts get-caller-identity

      - name: Create or verify S3 bucket
        shell: bash
        run: |
          if aws s3api head-bucket --bucket "$LAMBDA_BUCKET" 2>/dev/null; then
            echo "S3 bucket already exists: $LAMBDA_BUCKET"
          else
            echo "Creating S3 bucket: $LAMBDA_BUCKET"

            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket \
                --bucket "$LAMBDA_BUCKET"
            else
              aws s3api create-bucket \
                --bucket "$LAMBDA_BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi

            echo "S3 bucket created successfully"
          fi
          
      - name: Enable S3 bucket versioning
        run: |
          aws s3api put-bucket-versioning \
            --bucket "$LAMBDA_BUCKET" \
            --versioning-configuration Status=Enabled

      - name: Block public access
        run: |
          aws s3api put-public-access-block \
            --bucket "$LAMBDA_BUCKET" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - name: Upload Lambda package
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          S3_KEY="lambda-deployment-${TIMESTAMP}.zip"

          echo "S3_KEY=$S3_KEY" >> $GITHUB_ENV

          aws s3 cp \
            lambda-deployment.zip \
            "s3://${LAMBDA_BUCKET}/${S3_KEY}"

          echo "Lambda package uploaded as $S3_KEY"

      - name: Verify Lambda package
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_BUCKET" \
            --key "$S3_KEY"

      - name: Verify CloudFormation template
        run: |
          pwd
          ls -la
          ls -la cloudformation
          test -f cloudformation/infrastructure.yml
          echo "CloudFormation template found"

      - name: Validate CloudFormation Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/infrastructure.yml \
            --region "$AWS_REGION"

      - name: Deploy CloudFormation
        shell: bash
        run: |
          set +e

          echo "Applying pipeline patches..."

          # sed -i '/- AttributeName: createdAt/{N;d;}' cloudformation/infrastructure.yml
          # sed -i '/ReservedConcurrentExecutions:/d' cloudformation/infrastructure.yml

          echo "Deploying CloudFormation stack: $STACK_NAME"

          aws cloudformation deploy \
            --template-file cloudformation/infrastructure.yml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              Environment=prod \
              ProjectName="$PROJECT_NAME" \
              CreativeDriveApiKey="${{ secrets.CREATIVEDRIVE_API_KEY }}" \
              BynderClientId="${{ secrets.BYNDER_CLIENT_ID }}" \
              BynderClientSecret="${{ secrets.BYNDER_CLIENT_SECRET }}" \
              BynderAccessTokenUrl="${{ secrets.BYNDER_ACCESS_TOKEN_URL }}" \
              BynderApiBaseUrl="${{ secrets.BYNDER_API_BASE_URL }}" \
              LambdaZipBucket="$LAMBDA_BUCKET" \
              LambdaZipKey="$S3_KEY" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

          DEPLOY_STATUS=$?

          if [ $DEPLOY_STATUS -ne 0 ]; then
            echo "Deployment failed."

            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --max-items 30 \
              --output table

            exit $DEPLOY_STATUS
          fi

          echo "=========================================="
          echo "CloudFormation Stack Outputs"
          echo "=========================================="

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table

          echo ""
          echo "Deployment completed successfully!"
          echo ""
