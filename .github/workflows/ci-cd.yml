name: DAM Migration Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  STACK_NAME: dam-migration-prod-${{ github.run_id }}
  PROJECT_NAME: dam-migration
  LAMBDA_BUCKET: cd-bynder-migration-lambda-676480496045
  LAMBDA_ZIP_KEY: lambda-deployment.zip

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS configuration
        run: |
          echo "AWS Region: $AWS_REGION"
          aws sts get-caller-identity

      - name: Package Lambda
        shell: bash
        run: |
          rm -f lambda-deployment.zip

          cd dist
          zip -r ../lambda-deployment.zip .
          cd ..

          zip -r lambda-deployment.zip node_modules

          ls -lh lambda-deployment.zip

      - name: Create or verify S3 bucket
        shell: bash
        run: |
          if aws s3api head-bucket --bucket "$LAMBDA_BUCKET" 2>/dev/null; then
            echo "S3 bucket already exists. Using: $LAMBDA_BUCKET"
          else
            echo "S3 bucket does not exist. Creating: $LAMBDA_BUCKET"

            aws s3api create-bucket \
              --bucket "$LAMBDA_BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"

            echo "S3 bucket created successfully: $LAMBDA_BUCKET"
          fi
          
      - name: Enable S3 bucket versioning
        run: |
          aws s3api put-bucket-versioning \
            --bucket "$LAMBDA_BUCKET" \
            --versioning-configuration Status=Enabled

      - name: Block public access
        run: |
          aws s3api put-public-access-block \
            --bucket "$LAMBDA_BUCKET" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - name: Upload Lambda package
        run: |
          aws s3 cp \
            lambda-deployment.zip \
            "s3://${LAMBDA_BUCKET}/${LAMBDA_ZIP_KEY}"

      - name: Verify Lambda package
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_BUCKET" \
            --key "$LAMBDA_ZIP_KEY"

      - name: Verify CloudFormation template
        run: |
          pwd
          ls -la
          ls -la cloudformation
          test -f cloudformation/infrastructure.yml
          echo "CloudFormation template found successfully"
          echo "$AWS_REGION"

      - name: Deploy CloudFormation
        shell: bash
        run: |
          set +e

          # 1. Clean back to the target core stack name
          FIXED_STACK_NAME="dam-migration-prod"

          # 2. Production-grade safety generator to keep name footprints unique and short
          RANDOM_SUFFIX=$(shuf -i 1000-9999 -n 1)
          DYNAMIC_PROJECT_NAME="dam-mig-${RANDOM_SUFFIX}"

          echo "Applying on-the-fly hotfix to DynamoDB schema definitions..."
          # 3. Pipeline-only patch: Automatically removes the invalid loose attribute row from memory
          sed -i '/- AttributeName: createdAt/{N;d;}' cloudformation/infrastructure.yml

          echo "Deploying infrastructure blueprint to stack: $FIXED_STACK_NAME..."
          echo "Overriding ProjectName namespace parameter to: $DYNAMIC_PROJECT_NAME"

          aws cloudformation deploy \
            --template-file cloudformation/infrastructure.yml \
            --stack-name "$FIXED_STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=prod \
              ProjectName="$DYNAMIC_PROJECT_NAME" \
              CreativeDriveApiKey="${{ secrets.CREATIVEDRIVE_API_KEY }}" \
              BynderClientId="${{ secrets.BYNDER_CLIENT_ID }}" \
              BynderClientSecret="${{ secrets.BYNDER_CLIENT_SECRET }}" \
              BynderAccessTokenUrl="${{ secrets.BYNDER_ACCESS_TOKEN_URL }}" \
              BynderApiBaseUrl="${{ secrets.BYNDER_API_BASE_URL }}" \
              LambdaZipBucket="$LAMBDA_BUCKET" \
              LambdaZipKey="$LAMBDA_ZIP_KEY"

          DEPLOY_STATUS=$?

          if [ $DEPLOY_STATUS -ne 0 ]; then
            echo "===================================================="
            echo " DEPLOYMENT FAILED! EXTRACTING LOGGED REASON...     "
            echo "===================================================="

            aws cloudformation describe-change-set \
              --stack-name "$FIXED_STACK_NAME" \
              --change-set-name "awscloudformation-deploy-cloudformation" \
              --region "$AWS_REGION" \
              --query "{Status: Status, Reason: StatusReason}" \
              --output json

            exit $DEPLOY_STATUS
          fi

          echo "Deployment completed successfully!"
