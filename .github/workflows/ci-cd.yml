name: Deploy DAM Migration Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

env:
  AWS_REGION: us-east-1
  LAMBDA_ZIP_BUCKET: dam-migration-lambda-packages
  STACK_NAME: dam-migration-prod

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (TypeScript compile)
        run: npm run build

      - name: Package Lambda deployment zip
        run: |
          cd dist
          zip -r ../lambda-deployment.zip .
          cd ..
          # install only production deps for a lean Lambda package
          npm ci --omit=dev
          zip -r lambda-deployment.zip node_modules

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Lambda package to S3
        run: |
          aws s3 cp lambda-deployment.zip \
            "s3://${{ env.LAMBDA_ZIP_BUCKET }}/lambda-deployment-${{ github.sha }}.zip"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/infrastructure.yml \
            --stack-name "${{ env.STACK_NAME }}" \
            --parameter-overrides \
              Environment=prod \
              ProjectName=dam-migration \
              CreativeDriveApiKey="${{ secrets.CREATIVEDRIVE_API_KEY }}" \
              BynderClientId="${{ secrets.BYNDER_CLIENT_ID }}" \
              BynderClientSecret="${{ secrets.BYNDER_CLIENT_SECRET }}" \
              BynderAccessTokenUrl="${{ secrets.BYNDER_ACCESS_TOKEN_URL }}" \
              BynderApiBaseUrl="${{ secrets.BYNDER_API_BASE_URL }}" \
              LambdaZipBucket="${{ env.LAMBDA_ZIP_BUCKET }}" \
              LambdaZipKey="lambda-deployment-${{ github.sha }}.zip" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "${{ env.AWS_REGION }}" \
            --no-fail-on-empty-changeset