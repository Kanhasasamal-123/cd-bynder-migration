name: DAM Migration Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  STACK_NAME: dam-migration-prod
  PROJECT_NAME: dam-migration
  LAMBDA_BUCKET: cd-bynder-migration-lambda-676480496045
  LAMBDA_ZIP_KEY: lambda-deployment.zip

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS configuration
        run: |
          echo "AWS Region: $AWS_REGION"
          aws sts get-caller-identity

      - name: Package Lambda
        shell: bash
        run: |
          rm -f lambda-deployment.zip

          cd dist
          zip -r ../lambda-deployment.zip .
          cd ..

          zip -r lambda-deployment.zip node_modules

          ls -lh lambda-deployment.zip

      - name: Create or verify S3 bucket
        shell: bash
        run: |
          if aws s3api head-bucket --bucket "$LAMBDA_BUCKET" 2>/dev/null; then
            echo "S3 bucket already exists. Using: $LAMBDA_BUCKET"
          else
            echo "S3 bucket does not exist. Creating: $LAMBDA_BUCKET"

            aws s3api create-bucket \
              --bucket "$LAMBDA_BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"

            echo "S3 bucket created successfully: $LAMBDA_BUCKET"
          fi
          
      - name: Enable S3 bucket versioning
        run: |
          aws s3api put-bucket-versioning \
            --bucket "$LAMBDA_BUCKET" \
            --versioning-configuration Status=Enabled

      - name: Block public access
        run: |
          aws s3api put-public-access-block \
            --bucket "$LAMBDA_BUCKET" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - name: Upload Lambda package
        run: |
          aws s3 cp \
            lambda-deployment.zip \
            "s3://${LAMBDA_BUCKET}/${LAMBDA_ZIP_KEY}"

      - name: Verify Lambda package
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_BUCKET" \
            --key "$LAMBDA_ZIP_KEY"

      - name: Verify CloudFormation template
        run: |
          pwd
          ls -la
          ls -la cloudformation
          test -f cloudformation/infrastructure.yml
          echo "CloudFormation template found successfully"
          echo "$AWS_REGION"

      - name: Deploy CloudFormation
        shell: bash
        run: |
          set +e

          # Removed run_attempts to fix the trailing hyphen naming bug
          CHANGESET_NAME="cs-${{ github.run_id }}"
          echo "Creating unique ChangeSet: $CHANGESET_NAME"

          # 1. Create the Change Set using a clean JSON parameters array string
          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --template-body "file://cloudformation/infrastructure.yml" \
            --change-set-name "$CHANGESET_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --disable-validation \
            --parameters '[
              {"ParameterKey":"Environment","ParameterValue":"prod"},
              {"ParameterKey":"ProjectName","ParameterValue":"'"$PROJECT_NAME"'"},
              {"ParameterKey":"CreativeDriveApiKey","ParameterValue":"${{ secrets.CREATIVEDRIVE_API_KEY }}"},
              {"ParameterKey":"BynderClientId","ParameterValue":"${{ secrets.BYNDER_CLIENT_ID }}"},
              {"ParameterKey":"BynderClientSecret","ParameterValue":"${{ secrets.BYNDER_CLIENT_SECRET }}"},
              {"ParameterKey":"BynderAccessTokenUrl","ParameterValue":"${{ secrets.BYNDER_ACCESS_TOKEN_URL }}"},
              {"ParameterKey":"BynderApiBaseUrl","ParameterValue":"${{ secrets.BYNDER_API_BASE_URL }}"},
              {"ParameterKey":"LambdaZipBucket","ParameterValue":"'"$LAMBDA_BUCKET"'"},
              {"ParameterKey":"LambdaZipKey","ParameterValue":"'"$LAMBDA_ZIP_KEY"'"}
            ]'

          # 2. Wait for CloudFormation to compile the change set blueprint
          echo "Waiting for change set creation..."
          aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGESET_NAME" \
            --region "$AWS_REGION"

          COMPILE_STATUS=$?
          if [ $COMPILE_STATUS -ne 0 ]; then
            echo "CloudFormation compilation failed."
            echo "Retrieving ChangeSet failure reason..."
            aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGESET_NAME" \
              --region "$AWS_REGION" \
              --query "{Status: Status, Reason: StatusReason}" \
              --output json
            exit $COMPILE_STATUS
          fi

          # 3. Execute the deployment
          echo "Executing deployment..."
          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGESET_NAME" \
            --region "$AWS_REGION"

          # 4. Wait for the infrastructure to finish updating on AWS
          echo "Waiting for stack deployment to finish..."
          aws cloudformation wait stack-update-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"

          DEPLOY_STATUS=$?
          if [ $DEPLOY_STATUS -ne 0 ]; then
            echo "Deployment execution failed. Fetching colliding resource details..."
            
            # This extracts the exact resource name or type causing the rollback state
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED'].{Type:ResourceType, LogicalId:LogicalResourceId, Reason:ResourceStatusReason}" \
              --output json

            exit $DEPLOY_STATUS
          fi

          echo "Deployment completed successfully!"
