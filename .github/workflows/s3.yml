name: DAM Migration Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      migration_type:
        description: "Migration to run after deploy"
        required: true
        type: choice
        options:
          - none
          - gb
          - wb
          - both
          # RETRY FAILED ASSETS
          - retry-failed-assets
        default: none

      max_assets:
        description: "Maximum assets per division"
        required: true
        default: "5000"

      dry_run:
        description: "Dry run (no writes to CreativeDrive/S3/DynamoDB)"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "false"

      # RETRY FAILED ASSETS
      asset_ids:
        description: "Failed asset IDs to retry (one per line and/or comma-separated). Only used when migration_type = retry-failed-assets"
        required: false
        type: string

      # RETRY FAILED ASSETS
      only_failed:
        description: "Retry only assets whose DynamoDB status is FAILED"
        required: false
        type: boolean
        default: true

      # RETRY FAILED ASSETS
      sync_invoke:
        description: "Wait for the Lambda response (RequestResponse) instead of firing async (Event)"
        required: false
        type: boolean
        default: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  STACK_NAME: dam-migration-prod
  PROJECT_NAME: dam-migration-prod
  LAMBDA_BUCKET: cd-bynder-migration-lambda-676480496045
  LAMBDA_ZIP_KEY: lambda-deployment.zip
  # Must match "${ProjectName}-ingest-${Environment}" from s3-based-infrastructure.yml,
  # where ProjectName=dam-migration-prod and Environment=prod (both hardcoded below).
  INGEST_LAMBDA: dam-migration-prod-ingest-prod


jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Package Lambda
        shell: bash
        run: |
          rm -f lambda-deployment.zip

          cd dist
          zip -r ../lambda-deployment.zip .
          cd ..

          zip -r lambda-deployment.zip node_modules

          ls -lh lambda-deployment.zip



      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS configuration
        run: |
          echo "AWS Region: $AWS_REGION"
          aws sts get-caller-identity

      - name: Create or verify S3 bucket
        shell: bash
        run: |
          if aws s3api head-bucket --bucket "$LAMBDA_BUCKET" 2>/dev/null; then
            echo "S3 bucket already exists. Using: $LAMBDA_BUCKET"
          else
            echo "S3 bucket does not exist. Creating: $LAMBDA_BUCKET"

            aws s3api create-bucket \
              --bucket "$LAMBDA_BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"

            echo "S3 bucket created successfully: $LAMBDA_BUCKET"
          fi
          
      - name: Enable S3 bucket versioning
        run: |
          aws s3api put-bucket-versioning \
            --bucket "$LAMBDA_BUCKET" \
            --versioning-configuration Status=Enabled

      - name: Block public access
        run: |
          aws s3api put-public-access-block \
            --bucket "$LAMBDA_BUCKET" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - name: Upload Lambda package
        run: |
          aws s3 cp \
            lambda-deployment.zip \
            "s3://${LAMBDA_BUCKET}/${LAMBDA_ZIP_KEY}"

      - name: Verify Lambda package
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_BUCKET" \
            --key "$LAMBDA_ZIP_KEY"

      - name: Verify CloudFormation template
        run: |
          pwd
          ls -la
          ls -la cloudformation
          test -f cloudformation/s3-based-infrastructure.yml
          echo "CloudFormation template found successfully"
          echo "$AWS_REGION"

      - name: Verify required secrets are set
        shell: bash
        run: |
          missing=0

          check_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          }

          check_secret "CREATIVEDRIVE_API_KEY" "${{ secrets.CREATIVEDRIVE_API_KEY }}"

          if [ "$missing" -eq 1 ]; then
            echo "One or more required secrets are missing. Set them in the repo/environment secrets before deploying."
            exit 1
          fi

          echo "All required secrets are present."

      - name: Deploy CloudFormation
        shell: bash
        run: |
          set +e

          echo "Applying pipeline patches..."

          echo "Deploying infrastructure blueprint to stack: $STACK_NAME..."

          aws cloudformation deploy \
            --template-file cloudformation/s3-based-infrastructure.yml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=prod \
              ProjectName="$PROJECT_NAME" \
              CreativeDriveApiKey="${{ secrets.CREATIVEDRIVE_API_KEY }}" \
              LambdaZipBucket="$LAMBDA_BUCKET" \
              LambdaZipKey="$LAMBDA_ZIP_KEY"


          DEPLOY_STATUS=$?
          if [ $DEPLOY_STATUS -ne 0 ]; then
            echo "Deployment failed."
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --max-items 30 \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='ROLLBACK_IN_PROGRESS'].{Time:Timestamp, ResourceType:ResourceType, LogicalId:LogicalResourceId, StatusReason:ResourceStatusReason}" \
              --output json
            exit $DEPLOY_STATUS
          fi

          echo "Deployment completed successfully!"

  # ============================================================
  # Grey-background migration (division 76)
  # Only runs on manual dispatch with migration_type = gb | both,
  # and only after build-test-deploy has succeeded.
  # ============================================================
  run-gb:
    name: Run Grey Background Migration
    needs: build-test-deploy
    if: |
      github.event_name == 'workflow_dispatch' &&
      (inputs.migration_type == 'gb' || inputs.migration_type == 'both')
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Invoke Ingest Lambda - GB (division 76)
        shell: bash
        run: |
          set -euo pipefail

          DIVISION_ID="76"
          MAX_ASSETS="${{ inputs.max_assets }}"
          DRY_RUN="${{ inputs.dry_run }}"

          echo "=========================================="
          echo "Grey Background Migration"
          echo "=========================================="
          echo "Lambda: $INGEST_LAMBDA"
          echo "Division: $DIVISION_ID"
          echo "Max Assets: $MAX_ASSETS"
          echo "Dry Run: $DRY_RUN"

          PAYLOAD=$(jq -n \
            --arg divisionId "$DIVISION_ID" \
            --argjson maxAssets "$MAX_ASSETS" \
            --argjson dryRun "$DRY_RUN" \
            '{
              maxAssets: $maxAssets,
              mode: "full",
              divisionId: $divisionId,
              syncLastDays: 3650,
              fetchSort: "desc",
              dryRun: $dryRun
            }')

          echo "Payload:"
          echo "$PAYLOAD"

          STATUS_CODE=$(aws lambda invoke \
            --function-name "$INGEST_LAMBDA" \
            --invocation-type Event \
            --payload "$PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            --query 'StatusCode' \
            --output text \
            /dev/null)

          echo "Lambda Status Code: $STATUS_CODE"

          if [ "$STATUS_CODE" = "202" ]; then
            echo "Grey Background migration started"
          else
            echo "Failed to start Grey Background migration"
            exit 1
          fi

  # ============================================================
  # White-background migrations (all other divisions)
  # Only runs on manual dispatch with migration_type = wb | both,
  # and only after build-test-deploy has succeeded. Runs in
  # parallel with run-gb (both only depend on build-test-deploy).
  # ============================================================
  run-wb:
    name: Run White Background Migrations
    needs: build-test-deploy
    if: |
      github.event_name == 'workflow_dispatch' &&
      (inputs.migration_type == 'wb' || inputs.migration_type == 'both')
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Invoke Ingest Lambda - WB (all white-background divisions)
        shell: bash
        run: |
          set -euo pipefail

          DIVISIONS="45 46 65 89 231 232 233"
          MAX_ASSETS="${{ inputs.max_assets }}"
          DRY_RUN="${{ inputs.dry_run }}"

          echo "=========================================="
          echo "White Background Migration"
          echo "=========================================="
          echo "Lambda: $INGEST_LAMBDA"
          echo "Divisions: $DIVISIONS"
          echo "Max Assets: $MAX_ASSETS"
          echo "Dry Run: $DRY_RUN"

          for DIVISION_ID in $DIVISIONS; do
            echo ""
            echo "=========================================="
            echo "Starting Division: $DIVISION_ID"
            echo "=========================================="

            PAYLOAD=$(jq -n \
              --arg divisionId "$DIVISION_ID" \
              --argjson maxAssets "$MAX_ASSETS" \
              --argjson dryRun "$DRY_RUN" \
              '{
                maxAssets: $maxAssets,
                mode: "full",
                divisionId: $divisionId,
                syncLastDays: 3650,
                fetchSort: "desc",
                dryRun: $dryRun
              }')

            echo "Payload:"
            echo "$PAYLOAD"

            STATUS_CODE=$(aws lambda invoke \
              --function-name "$INGEST_LAMBDA" \
              --invocation-type Event \
              --payload "$PAYLOAD" \
              --cli-binary-format raw-in-base64-out \
              --query 'StatusCode' \
              --output text \
              /dev/null)

            echo "Lambda Status Code: $STATUS_CODE"

            if [ "$STATUS_CODE" = "202" ]; then
              echo "Division $DIVISION_ID migration started"
            else
              echo "Division $DIVISION_ID failed to start"
              exit 1
            fi
          done

          echo ""
          echo "All White Background migrations started"

  # ============================================================
  # RETRY FAILED ASSETS
  # Retries assets whose DynamoDB tracker status is FAILED by
  # invoking the ingest Lambda with action=retry-failed-assets.
  # Reference behavior ported from the old Bitbucket
  # `retry-failed-assets` custom pipeline.
  # Only runs on manual dispatch with migration_type = retry-failed-assets,
  # and only after build-test-deploy has succeeded.
  # ============================================================
  retry-failed-assets:
    name: Retry Failed Assets
    needs: build-test-deploy
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.migration_type == 'retry-failed-assets'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify ingest Lambda exists
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking Lambda: $INGEST_LAMBDA"
          aws lambda get-function \
            --function-name "$INGEST_LAMBDA" \
            --query 'Configuration.[FunctionName,LastModified,Runtime,Timeout]' \
            --output table

      - name: Invoke Ingest Lambda - Retry Failed Assets
        shell: bash
        env:
          ASSET_IDS_RAW: ${{ inputs.asset_ids }}
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY_FAILED: ${{ inputs.only_failed }}
          SYNC_INVOKE: ${{ inputs.sync_invoke }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Retry Failed Assets"
          echo "=========================================="
          echo "Lambda: $INGEST_LAMBDA"
          echo "Dry Run: $DRY_RUN"
          echo "Only Failed: $ONLY_FAILED"
          echo "Sync Invoke: $SYNC_INVOKE"

          # Parse asset_ids: accepts one-per-line, comma-separated, and/or
          # semicolon-separated input; trims whitespace and drops blanks.
          ASSET_IDS_JSON=$(printf '%s' "$ASSET_IDS_RAW" \
            | tr ',;' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -v '^$' \
            | jq -R . \
            | jq -s -c .)

          ASSET_COUNT=$(echo "$ASSET_IDS_JSON" | jq 'length')
          echo "Parsed asset count: $ASSET_COUNT"

          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "::error::No asset IDs supplied. Provide asset_ids (one per line and/or comma-separated) when running with migration_type=retry-failed-assets."
            exit 1
          fi

          echo "First IDs: $(echo "$ASSET_IDS_JSON" | jq -c '.[0:3]')"

          DRY_RUN_JSON=$([ "$DRY_RUN" = "true" ] && echo true || echo false)
          ONLY_FAILED_JSON=$([ "$ONLY_FAILED" = "true" ] && echo true || echo false)

          PAYLOAD=$(jq -n \
            --arg action "retry-failed-assets" \
            --argjson assetIds "$ASSET_IDS_JSON" \
            --argjson dryRun "$DRY_RUN_JSON" \
            --argjson onlyFailed "$ONLY_FAILED_JSON" \
            '{action: $action, assetIds: $assetIds, dryRun: $dryRun, onlyFailed: $onlyFailed}')

          echo "$PAYLOAD" > /tmp/retry-failed-payload.json

          echo "Payload preview:"
          jq -c '{action, assetCount: (.assetIds | length), dryRun, onlyFailed}' /tmp/retry-failed-payload.json

          INVOKE_TYPE=$([ "$SYNC_INVOKE" = "true" ] && echo RequestResponse || echo Event)
          echo "Invoking Lambda ($INVOKE_TYPE)..."

          INVOKE_RESULT=$(aws lambda invoke \
            --function-name "$INGEST_LAMBDA" \
            --invocation-type "$INVOKE_TYPE" \
            --payload file:///tmp/retry-failed-payload.json \
            --cli-binary-format raw-in-base64-out \
            /tmp/retry-failed-response.json)

          echo "Invoke result: $INVOKE_RESULT"

          FUNCTION_ERROR=$(echo "$INVOKE_RESULT" | jq -r '.FunctionError // empty')
          if [ -n "$FUNCTION_ERROR" ]; then
            echo "::error::Lambda invocation error: $FUNCTION_ERROR"
            cat /tmp/retry-failed-response.json
            exit 1
          fi

          echo "Lambda response:"
          cat /tmp/retry-failed-response.json
          echo ""

          if [ "$INVOKE_TYPE" = "Event" ]; then
            STATUS_CODE=$(echo "$INVOKE_RESULT" | jq -r '.StatusCode')
            if [ "$STATUS_CODE" = "202" ]; then
              echo "Async invoke accepted — check CloudWatch log group: /aws/lambda/$INGEST_LAMBDA"
            else
              echo "::error::Lambda invocation failed with status code: $STATUS_CODE"
              exit 1
            fi
          else
            STATUS_CODE=$(jq -r '.statusCode // empty' /tmp/retry-failed-response.json)
            if [ "$STATUS_CODE" = "200" ]; then
              echo "retry-failed-assets completed"
              jq -r '.body // empty' /tmp/retry-failed-response.json | jq . 2>/dev/null || jq -r '.body // empty' /tmp/retry-failed-response.json
            else
              echo "::error::Lambda returned statusCode: ${STATUS_CODE:-unknown}"
              exit 1
            fi
          fi