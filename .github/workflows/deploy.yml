name: DAM Migration - Build, Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      maxAssets:
        description: 'Max number of assets to migrate'
        required: false
        default: '50'
        type: string
      mode:
        description: 'Migration mode'
        required: false
        default: 'delta'
        type: choice
        options:
          - delta
          - full
      folderNames:
        description: 'Optional comma-separated FOLDER_NAMES filter'
        required: false
        default: ''
        type: string
      assetIds:
        description: 'Optional comma-separated ASSET_IDS filter'
        required: false
        default: ''
        type: string
      invokeIngest:
        description: 'Invoke the Ingest Lambda after deploy'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  STACK_NAME: dam-migration-prod
  LAMBDA_ZIP_KEY: lambda-deployment.zip

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check / build
        run: npm run build

      - name: Unit tests
        run: npm test -- --coverage

      # - name: Integration tests
      #   run: npm run test:integration
      #   env:
      #     CREATIVEDRIVE_API_KEY: ${{ secrets.CREATIVEDRIVE_API_KEY }}
      #     BYNDER_CLIENT_ID: ${{ secrets.BYNDER_CLIENT_ID }}
      #     BYNDER_CLIENT_SECRET: ${{ secrets.BYNDER_CLIENT_SECRET }}
      #     BYNDER_ACCESS_TOKEN_URL: ${{ secrets.BYNDER_ACCESS_TOKEN_URL }}
      #     BYNDER_API_BASE_URL: ${{ secrets.BYNDER_API_BASE_URL }}

      - name: Package Lambda functions
        run: |
          mkdir -p dist_package
          cp -r dist/. dist_package/
          cp -r node_modules dist_package/
          cd dist_package
          zip -r ../lambda-deployment.zip .

      - name: Upload Lambda package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-deployment
          path: lambda-deployment.zip
          retention-days: 7

  deploy:
    name: Deploy Infrastructure
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lambda package artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-deployment

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Derive unique Lambda package bucket name
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "LAMBDA_ZIP_BUCKET=dam-migration-lambda-packages-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Ensure Lambda package S3 bucket exists
        run: |
          # head-bucket only succeeds if the bucket exists AND you own it.
          # A 4xx here means "doesn't exist" or "owned by someone else" -
          # since the name above is account-scoped, it's safe to create.
          if ! aws s3api head-bucket --bucket "${LAMBDA_ZIP_BUCKET}" 2>/dev/null; then
            aws s3 mb "s3://${LAMBDA_ZIP_BUCKET}" --region "${AWS_REGION}"
            aws s3api put-public-access-block \
              --bucket "${LAMBDA_ZIP_BUCKET}" \
              --public-access-block-configuration \
                BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

      - name: Import pre-existing assets bucket into the stack (if needed)
        env:
          ASSETS_BUCKET: dam-migration-assets-prod
        run: |
          set -e

          if ! aws s3api head-bucket --bucket "${ASSETS_BUCKET}" 2>/dev/null; then
            echo "Bucket ${ASSETS_BUCKET} doesn't exist yet - CloudFormation will create it normally."
            exit 0
          fi
          echo "Bucket ${ASSETS_BUCKET} already exists."

          if aws cloudformation describe-stack-resource \
               --stack-name "${STACK_NAME}" \
               --logical-resource-id MigrationAssetsBucket >/dev/null 2>&1; then
            echo "Already managed by stack ${STACK_NAME} - nothing to import."
            exit 0
          fi

          echo "Importing existing bucket into the stack as MigrationAssetsBucket..."
          cat > import-resources.json <<EOF
          [
            {
              "ResourceType": "AWS::S3::Bucket",
              "LogicalResourceId": "MigrationAssetsBucket",
              "ResourceIdentifier": { "BucketName": "${ASSETS_BUCKET}" }
            }
          ]
          EOF

          aws cloudformation create-change-set \
            --stack-name "${STACK_NAME}" \
            --change-set-name import-assets-bucket-$(date +%s) \
            --change-set-type IMPORT \
            --resources-to-import file://import-resources.json \
            --template-body file://cloudformation/infrastructure.yml \
            --parameters \
              ParameterKey=Environment,ParameterValue=prod \
              ParameterKey=ProjectName,ParameterValue=dam-migration \
              ParameterKey=CreativeDriveApiKey,ParameterValue="${{ secrets.CREATIVEDRIVE_API_KEY }}" \
              ParameterKey=BynderClientId,ParameterValue="${{ secrets.BYNDER_CLIENT_ID }}" \
              ParameterKey=BynderClientSecret,ParameterValue="${{ secrets.BYNDER_CLIENT_SECRET }}" \
              ParameterKey=BynderAccessTokenUrl,ParameterValue="${{ secrets.BYNDER_ACCESS_TOKEN_URL }}" \
              ParameterKey=BynderApiBaseUrl,ParameterValue="${{ secrets.BYNDER_API_BASE_URL }}" \
              ParameterKey=LambdaZipBucket,ParameterValue="${LAMBDA_ZIP_BUCKET}" \
              ParameterKey=LambdaZipKey,ParameterValue="${LAMBDA_ZIP_KEY}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --query 'Id' --output text > changeset-id.txt

          CHANGESET_ID=$(cat changeset-id.txt)
          aws cloudformation wait change-set-create-complete --change-set-name "${CHANGESET_ID}"
          aws cloudformation execute-change-set --change-set-name "${CHANGESET_ID}"
          aws cloudformation wait stack-import-complete --stack-name "${STACK_NAME}"
          echo "Import complete."

      - name: Upload Lambda package to S3
        run: |
          aws s3 cp lambda-deployment.zip "s3://${LAMBDA_ZIP_BUCKET}/${LAMBDA_ZIP_KEY}"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/infrastructure.yml \
            --stack-name "${STACK_NAME}" \
            --parameter-overrides \
              Environment=prod \
              ProjectName=dam-migration \
              CreativeDriveApiKey="${{ secrets.CREATIVEDRIVE_API_KEY }}" \
              BynderClientId="${{ secrets.BYNDER_CLIENT_ID }}" \
              BynderClientSecret="${{ secrets.BYNDER_CLIENT_SECRET }}" \
              BynderAccessTokenUrl="${{ secrets.BYNDER_ACCESS_TOKEN_URL }}" \
              BynderApiBaseUrl="${{ secrets.BYNDER_API_BASE_URL }}" \
              LambdaZipBucket="${LAMBDA_ZIP_BUCKET}" \
              LambdaZipKey="${LAMBDA_ZIP_KEY}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset

      - name: Invoke Ingest Lambda (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.invokeIngest == 'true'
        run: |
          PAYLOAD=$(jq -n \
            --arg maxAssets "${{ github.event.inputs.maxAssets }}" \
            --arg mode "${{ github.event.inputs.mode }}" \
            --arg folderNames "${{ github.event.inputs.folderNames }}" \
            --arg assetIds "${{ github.event.inputs.assetIds }}" \
            '{maxAssets: ($maxAssets | tonumber), mode: $mode, folderNames: ($folderNames | select(length > 0) // null), assetIds: ($assetIds | select(length > 0) // null)}')
          echo "Invoking with payload: ${PAYLOAD}"
          aws lambda invoke \
            --function-name dam-migration-ingest-prod \
            --payload "$(echo "$PAYLOAD" | base64)" \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json

      - name: Upload ingest response
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.invokeIngest == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ingest-response
          path: response.json